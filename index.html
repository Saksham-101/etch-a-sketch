<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js" defer></script>
</head>
<body>
    <div class="nav">
        <button class="set-grid">Set Grid</button>
        <div class="color">
            <label for='clr-input'>Choose a color</label>
            <input type="color" id="clr-input">
        </div>
            <button class="random-clr">Random Color</button>
            <button class="black-opacity">Black Opacity</button>   
    </div>
    <div class="container">
    </div>
</body>
</html>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

    body {
        font-family: 'Pixelify Sans';
    }
    .container {
        box-sizing: border-box;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: flex-start;
        flex-wrap: wrap;
        width: 640px;
        height: 640px;
    }
    
    .child {
        box-sizing: border-box;
        width: 40px;
        height: 40px;
        background-color: grey;
        border: 1px solid white;
    }

    .squares {
        background-color: grey;
        box-sizing: border-box;
        border: 1px solid white;
    }
    
    .color {
        background-color: rgb(246, 130, 246);
        width: 200px;
        height: 40px;
        display: flex;
        justify-content: center;
        align-items: center;
        border: 2px solid cyan;
        border-radius: 5px;
    }

    button {
        background-color: rgb(246, 130, 246);
        width: 200px;
        height: 40px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1.1em;
        font-family: 'Pixelify Sans';
        border: 2px solid cyan;
        border-radius: 5px;
    }
    .nav {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 4px;
    }
</style>
